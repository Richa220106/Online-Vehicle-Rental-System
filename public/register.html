<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - RentDrive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Customer Registration</h1>
          <p>Create your account in less than a minute.</p>
        </div>

        <div id="auth-alert"></div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input 
              type="text" 
              id="name" 
              class="form-control" 
              placeholder="e.g. John Doe" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input 
              type="email" 
              id="email" 
              class="form-control" 
              placeholder="name@example.com" 
              required
            >
            <span class="form-note">Must be unique; used to sign in.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input 
              type="tel" 
              id="phone" 
              class="form-control" 
              placeholder="e.g. 9876543210" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              required 
              minlength="6"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input 
              type="password" 
              id="confirm-password" 
              class="form-control" 
              placeholder="Repeat your password" 
              required 
              minlength="6"
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already registered? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 RentDrive Online Vehicle Rental System • College SE Project</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
